<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Story Sprout Reader</title>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Custom styling to ensure the font looks friendly and the layout is centered -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f0f4f8; /* Light background */
        }
        .correct {
            background-color: #10b981 !important; /* Tailwind green-500 */
            color: white !important;
            border: 3px solid #059669; /* Tailwind green-600 */
        }
        .incorrect {
            background-color: #ef4444 !important; /* Tailwind red-500 */
            color: white !important;
            border: 3px solid #dc2626; /* Tailwind red-600 */
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <!-- Main Story Container -->
    <div id="story-container" class="bg-white shadow-2xl rounded-xl w-full max-w-4xl overflow-hidden flex flex-col transition-all duration-300">
        
        <!-- Header -->
        <header class="p-4 bg-indigo-600 text-white text-center rounded-t-xl">
            <h1 class="text-xl sm:text-3xl font-extrabold">🚀 English with Joanna</h1>
            <p class="text-xs sm:text-sm opacity-90">Listen, Read, and Learn!</p>
        </header>

        <!-- Story Content Area -->
        <!-- Reduced vertical space (space-y-4) compared to previous (space-y-6) -->
        <main class="flex-grow p-4 sm:p-6 md:p-8 space-y-4">
            
            <!-- Image Display -->
            <div class="relative bg-gray-200 rounded-lg overflow-hidden border-4 border-indigo-200 aspect-[16/10] sm:aspect-video flex items-center justify-center">
                <!-- Image element with error fallback -->
                <img id="story-image" src="" alt="Story illustration" class="w-full h-full object-contain transition-opacity duration-500"
                     onerror="this.onerror=null; this.src='https://placehold.co/800x450/ef4444/ffffff?text=Image+Load+Error'; document.getElementById('loading-indicator').classList.add('hidden');">
                <div id="loading-indicator" class="absolute inset-0 flex items-center justify-center bg-gray-800 bg-opacity-70 text-white text-lg font-bold hidden">Loading...</div>
            </div>

            <!-- Subtitle/Text Area (Caption - Reduced Font Size) -->
            <div id="text-area-wrapper" class="bg-white p-3 sm:p-4 rounded-lg shadow-inner border border-gray-200 min-h-[4rem] sm:min-h-[5rem] flex items-center justify-center">
                <!-- Reduced text size: text-lg on mobile, text-xl on desktop -->
                <p id="story-text" class="text-lg md:text-xl text-gray-800 font-semibold text-center leading-relaxed">Click "Next" to begin the story!</p>
            </div>

            <!-- Quiz Area (Buttons for Answers - Reduced Size) -->
            <div id="quiz-area" class="space-y-3 hidden pt-3">
                <p class="text-base sm:text-xl text-gray-700 font-medium text-center" id="quiz-title">Test Your Knowledge!</p>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 sm:gap-4">
                    <!-- Quiz Buttons - Reduced padding on mobile -->
                    <button data-answer="A" id="answer-A" class="quiz-btn px-3 py-2 sm:px-4 sm:py-3 bg-indigo-100 text-indigo-800 text-base sm:text-lg font-bold rounded-xl hover:bg-indigo-200 transition duration-150 shadow-md transform hover:scale-[1.01] active:scale-[0.99] text-left">A: Option A</button>
                    <button data-answer="B" id="answer-B" class="quiz-btn px-3 py-2 sm:px-4 sm:py-3 bg-indigo-100 text-indigo-800 text-base sm:text-lg font-bold rounded-xl hover:bg-indigo-200 transition duration-150 shadow-md transform hover:scale-[1.01] active:scale-[0.99] text-left">B: Option B</button>
                    <button data-answer="C" id="answer-C" class="quiz-btn px-3 py-2 sm:px-4 sm:py-3 bg-indigo-100 text-indigo-800 text-base sm:text-lg font-bold rounded-xl hover:bg-indigo-200 transition duration-150 shadow-md transform hover:scale-[1.01] active:scale-[0.99] text-left">C: Option C</button>
                    <button data-answer="D" id="answer-D" class="quiz-btn px-3 py-2 sm:px-4 sm:py-3 bg-indigo-100 text-indigo-800 text-base sm:text-lg font-bold rounded-xl hover:bg-indigo-200 transition duration-150 shadow-md transform hover:scale-[1.01] active:scale-[0.99] text-left">D: Option D</button>
                </div>
                <p id="quiz-feedback" class="text-center text-lg sm:text-xl font-extrabold min-h-[1.5rem] pt-2"></p>
            </div>

        </main>

        <!-- Controls and Navigation -->
        <footer class="p-4 bg-white border-t border-gray-100 flex flex-col sm:flex-row justify-between items-center space-y-4 sm:space-y-0">
            
            <!-- Audio Playback Button - Reduced padding/size on mobile -->
            <button id="play-audio-btn" class="w-full sm:w-auto px-4 py-2 sm:px-6 sm:py-3 bg-green-500 hover:bg-green-600 text-white text-base sm:text-lg font-bold rounded-full shadow-lg transition duration-200 disabled:opacity-50 flex items-center justify-center">
                <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12"></path>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v10a2 2 0 002 2h2"></path>
                </svg>
                <span id="play-audio-text">Listen Again</span>
            </button>

            <!-- Hidden Audio Element -->
            <audio id="story-audio" class="hidden"></audio>

            <!-- Navigation Buttons - Reduced padding/size on mobile -->
            <div class="flex space-x-4">
                <!-- Previous Button -->
                <button id="prev-btn" class="px-4 py-2 sm:px-6 sm:py-3 bg-gray-300 hover:bg-gray-400 text-gray-800 text-base sm:text-lg font-bold rounded-full shadow transition duration-200 disabled:opacity-50 flex items-center" disabled>
                    <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 19l-7-7 7-7m8 14l-7-7 7-7"></path></svg>
                    Previous
                </button>
                
                <!-- Next Button -->
                <button id="next-btn" class="px-4 py-2 sm:px-6 sm:py-3 bg-indigo-500 hover:bg-indigo-600 text-white text-base sm:text-lg font-bold rounded-full shadow-lg transition duration-200 flex items-center">
                    Next
                    <svg class="w-5 h-5 ml-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 5l7 7-7 7M5 5l7 7-7 7"></path></svg>
                </button>
            </div>
        </footer>

    </div>

    <script>
        const GITHUB_BASE = 'https://raw.githubusercontent.com/0xdfkoikoi/joanna/refs/heads/main/story/';
        
        // --- QUIZ DATA ---
        // Questions grouped by story so each story shows its own quiz immediately after.
        const quizPools = {
            hare: [
                {
                    audio: GITHUB_BASE + 'q1.mp3',
                    question: "Why did Harold lose the race?",
                    options: {
                        A: "he was not fast enough",
                        B: "He stopped to eat and sleep because he was overconfident", // Correct
                        C: "He got lost in the forest",
                        D: "Toby cheated"
                    },
                    correctAnswer: "B"
                },
                {
                    audio: GITHUB_BASE + 'q2.mp3',
                    question: "What helped Toby win the race?",
                    options: {
                        A: "He ran very fast at the start",
                        B: "He kept moving steadily without giving up", // Correct
                        C: "Harold helped Toby",
                        D: "Toby took a shortcuts"
                    },
                    correctAnswer: "B"
                },
                {
                    audio: GITHUB_BASE + 'q3.mp3',
                    question: "What is the main lesson of the story?",
                    options: {
                        A: "If you take a shortcuts you will win",
                        B: "Fasrt animal always win",
                        C: "Staying patient and consistent can lead to success", // Correct
                        D: "Being slow means you cannot win"
                    },
                    correctAnswer: "C"
                }
            ],
            joanna: [
                {
                    audio: GITHUB_BASE + 'q4.mp3',
                    question: "Why did Joanna help the little cat even though it was raining?",
                    options: {
                        A: "She wanted other children to praise her",
                        B: "She wanted to keep the cat for herself",
                        C: "She felt kindness was the right thing to do", // Correct
                        D: "She was told by her teacher"
                    },
                    correctAnswer: "C"
                },
                {
                    audio: GITHUB_BASE + 'q5.mp3',
                    question: "What does Joanna’s response to the reward show about her character?",
                    options: {
                        A: "She was shy of strangers",
                        B: "She only helped when asked",
                        C: "She cared more about kindness than rewards", // Correct
                        D: "She did not like gifts"
                    },
                    correctAnswer: "C"
                },
                {
                    audio: GITHUB_BASE + 'q6.mp3',
                    question: "What is the main lesson of the story?",
                    options: {
                        A: "Always take animals home",
                        B: "Being kind without expecting anything in return is important", // Correct
                        C: "Rewards are the best part of helping others",
                        D: "Children should walk home in the rain"
                    },
                    correctAnswer: "B"
                }
            ]
        };

        // --- STORY DATA (1 Intro + 14 Hare/Tortoise Pages + Hare Quiz + 6 Joanna Pages + Joanna Quiz = 23 pages total) ---
        const storyData = [
            // Page 0 (Index 0): INTRO PAGE
            {
                image: GITHUB_BASE + 'opening.jpg',
                audio: GITHUB_BASE + 'opening.mp3',
                text: "Learn english with Joanna Stella Norton, sponsored by Toko Gangan."
            },
            // Hare & Tortoise Story
            { image: GITHUB_BASE + '1.jpg', audio: GITHUB_BASE + '1.mp3', text: "In a sun-dappled forest lived a very speedy hare named Harold and a deliberate, thoughtful turtle named Toby." },
            { image: GITHUB_BASE + '2.jpg', audio: GITHUB_BASE + '2.mp3', text: "Harold was known throughout the woods for his incredible speed and his even more incredible arrogance. I'm the fastest creature alive! he'd boast to anyone who would listen." },
            { image: GITHUB_BASE + '3.jpg', audio: GITHUB_BASE + '3.mp3', text: "One afternoon, tired of the rabbit’s bragging, Toby challenged him. Let's have a race, Harold. From the big oak tree down to the riverbank." },
            { image: GITHUB_BASE + '4.jpg', audio: GITHUB_BASE + '4.mp3', text: "Harold roared with laughter. You? Race me? That’s the funniest thing I’ve heard all year! I accept, just so everyone can witness my greatness." },
            { image: GITHUB_BASE + '5.jpg', audio: GITHUB_BASE + '5.mp3', text: "The forest animals gathered to watch. The fox started the race, shouting, Go!" },
            { image: GITHUB_BASE + '6.jpg', audio: GITHUB_BASE + '6.mp3', text: "Harold shot forward like an arrow released from a bow. He was out of sight in seconds, leaving Toby shuffling slowly behind." },
            { image: GITHUB_BASE + '7.jpg', audio: GITHUB_BASE + '7.mp3', text: "As Harold approached the halfway mark, he suddenly noticed something wonderful—a lush patch of wild forest carrots growing beside the trail. Their tops were bright green, and the orange roots peeked temptingly from the soil. Harold’s mouth watered instantly." },
            { image: GITHUB_BASE + '8.jpg', audio: GITHUB_BASE + '8.mp3', text: "Well… a champion deserves a snack, he told himself. Besides, Toby won’t reach this spot for ages. Without hesitation, Harold darted into the garden and munched happily on a few carrots, savoring their crisp sweetness" },
            { image: GITHUB_BASE + '9.jpg', audio: GITHUB_BASE + '9.mp3', text: "After stuffing himself just enough to feel satisfied, he hopped back onto the path feeling proud and refreshed. He then looked back down the long, empty road. Toby was nowhere in sight—just as he expected. Harold smirked. Toby is so slow, he’ll take hours to get here, he thought. I have plenty of time for a quick nap and still win. Harold settled comfortably under a large, shady tree and quickly fell into a deep sleep, dreaming of victory banners and gold medals." },
            { image: GITHUB_BASE + '10.jpg', audio: GITHUB_BASE + '10.mp3', text: "Meanwhile, Toby kept moving. Step after step after step. He didn’t look back or worry about the speedy rabbit. He just focused on putting one foot in front of the other, maintaining a steady, unwavering pace" },
            { image: GITHUB_BASE + '11.jpg', audio: GITHUB_BASE + '11.mp3', text: "He passed the sleeping rabbit, who was snoring softly under the tree. Toby didn’t stop or break his rhythm. He knew the race wasn’t about being fast at the start; it was about finishing." },
            { image: GITHUB_BASE + '12.jpg', audio: GITHUB_BASE + '12.mp3', text: "A little while later, Harold awoke. He stretched, yawned, and looked toward the finish line, expecting to see Toby far behind. To his horror, he saw the turtle only a few yards from the riverbank! Harold jumped up and sprinted with all his might, a desperate blur of motion." },
            { image: GITHUB_BASE + '13.jpg', audio: GITHUB_BASE + '13.mp3', text: "But it was too late. Just as he reached full speed, Toby crossed the finish line. Toby the Turtle had won." },
            { image: GITHUB_BASE + '14.jpg', audio: GITHUB_BASE + '14.mp3', text: "The forest animals cheered for the unexpected victor. Harold, sweaty and defeated, learned a valuable lesson that day: Slow and steady wins the race—even if you're fast enough to snack along the way." },

            // Quiz after Hare & Tortoise
            {
                image: 'https://placehold.co/800x450/4f46e5/ffffff?text=QUIZ+TIME',
                audio: GITHUB_BASE + 'q1.mp3',
                text: "You have finished the Hare & Tortoise story! Now, test your knowledge.",
                isQuiz: true,
                quizId: 'hare'
            },

            // Joanna & the Cat Story
            { image: GITHUB_BASE + '15.jpg', audio: GITHUB_BASE + '15.mp3', text: "Joanna was a very kind and humble girl, She always spoke softly, helped others without being asked, and never bragged about the good things she did." },
            { image: GITHUB_BASE + '16.jpg', audio: GITHUB_BASE + '16.mp3', text: "One rainy afternoon, while walking home from school, Joanna heard a tiny “meow” coming from under a wooden bench. There she found a little cat, wet, hungry, and shivering. Other children passed by, but Joanna gently picked the cat up and wrapped it in her scarf." },
            { image: GITHUB_BASE + '17.jpg', audio: GITHUB_BASE + '17.mp3', text: "She took the little cat home, dried its fur, and shared her dinner. “You need it more than I do,” she whispered with a smile." },
            { image: GITHUB_BASE + '18.jpg', audio: GITHUB_BASE + '18.mp3', text: "The next day, Joanna put up a small sign asking if anyone had lost a cat. Soon, an old woman came running, her eyes full of tears." },
            { image: GITHUB_BASE + '19.jpg', audio: GITHUB_BASE + '19.mp3', text: "The woman thanked Joanna and offered her a reward, but Joanna politely shook her head. “I’m just happy the little cat is safe” she said." },
            { image: GITHUB_BASE + '20.jpg', audio: GITHUB_BASE + '20.mp3', text: "Joanna knew that being kind—even when no one is watching—was the best reward of all." },

            // Quiz after Joanna story
            {
                image: 'https://placehold.co/800x450/4f46e5/ffffff?text=QUIZ+TIME',
                audio: GITHUB_BASE + 'q4.mp3',
                text: "You have finished Joanna’s story! Now, test your knowledge.",
                isQuiz: true,
                quizId: 'joanna'
            }
        ];

        // --- State Variables ---
        let currentPageIndex = -1; // Start at -1 to show a welcome screen first
        let isAudioPlaying = false;
        let isQuizAnswered = false;
        let currentQuizQuestion = null; // Stores the currently loaded quiz question
        let currentQuizId = null; // Which quiz is active (hare, joanna, etc.)
        const quizSessions = {}; // Tracks remaining questions per quizId

        // --- DOM Elements ---
        const storyImage = document.getElementById('story-image');
        const storyAudio = document.getElementById('story-audio');
        const storyText = document.getElementById('story-text');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const playAudioBtn = document.getElementById('play-audio-btn');
        const loadingIndicator = document.getElementById('loading-indicator');
        const playAudioText = document.getElementById('play-audio-text');
        
        // Quiz DOM Elements
        const quizAudio = document.getElementById('quiz-audio');
        const playQuizAudioBtn = document.getElementById('play-quiz-audio-btn');
        const loadingQuizIndicator = document.getElementById('loading-quiz-indicator');
        const playQuizAudioText = document.getElementById('play-quiz-audio-text');
        const quizArea = document.getElementById('quiz-area');  
        const quizFeedback = document.getElementById('quiz-feedback');
        const quizButtons = document.querySelectorAll('.quiz-btn');
        const quizQuestionWrapper = document.getElementById('text-area-wrapper');

        /**
         * Loads and displays the specified story page.
         * @param {number} index The index of the story page to load.
         */
        function loadStoryPage(index) {
            if (index < 0) {
                index = 0;
            }
            if (index >= storyData.length) {
                // If attempting to load past the last index, stay on the last index (the quiz end screen)
                index = storyData.length - 1; 
            }

            currentPageIndex = index;
            const page = storyData[index];
            const isQuizPage = page.isQuiz || false;

            // 1. Reset Quiz UI and State
            quizArea.classList.add('hidden');
            quizQuestionWrapper.classList.remove('hidden');
            quizFeedback.textContent = '';
            quizButtons.forEach(btn => {
                btn.classList.remove('correct', 'incorrect');
                btn.disabled = false;
            });
            isQuizAnswered = false;
            currentQuizQuestion = null; // Clear the previous question

            // 2. Update UI state (Loading)
            storyImage.style.opacity = '0';
            loadingIndicator.classList.remove('hidden');
            playAudioBtn.disabled = true;

            // 3. Update Content
            storyImage.onload = () => {
                storyImage.style.opacity = '1';
                loadingIndicator.classList.add('hidden');
            };
            
            storyImage.src = page.image;
            storyAudio.src = page.audio;
            
            if (isQuizPage) {
                // --- QUIZ LOGIC ---
                currentQuizId = page.quizId || 'default';
                const pool = quizPools[currentQuizId] || [];

                // Initialize or continue the question pool for this quiz
                if (!quizSessions[currentQuizId] || quizSessions[currentQuizId].length === 0) {
                    quizSessions[currentQuizId] = [...pool];
                    // Simple shuffle implementation (Fisher-Yates style)
                    for (let i = quizSessions[currentQuizId].length - 1; i > 0; i--) {
                        const j = Math.floor(Math.random() * (i + 1));
                        [quizSessions[currentQuizId][i], quizSessions[currentQuizId][j]] = [quizSessions[currentQuizId][j], quizSessions[currentQuizId][i]];
                    }
                }

                if (quizSessions[currentQuizId].length > 0) {
                    // Load the next question from the pool
                    currentQuizQuestion = quizSessions[currentQuizId].pop();

                    // Set up Quiz Page UI
                    quizArea.classList.remove('hidden');
                    storyText.classList.remove('text-center'); 
                    
                    // Display the question with current count
                    const totalQuestions = pool.length;
                    const currentQNum = totalQuestions - quizSessions[currentQuizId].length;
                    storyText.textContent = `Question ${currentQNum}/${totalQuestions}: ${currentQuizQuestion.question}`; 
                    
                    // Populate options
                    quizButtons.forEach(btn => {
                        const answerKey = btn.getAttribute('data-answer');
                        btn.textContent = `${answerKey}: ${currentQuizQuestion.options[answerKey]}`;
                    });
                    
                    // Load and play the quiz question audio
                    storyAudio.pause();
                    storyAudio.currentTime = 0;
                    storyAudio.src = currentQuizQuestion.audio;
                    // Try to play immediately (within user interaction context from Next button click)
                    // The browser will handle loading if needed
                    const playPromise = storyAudio.play();
                    if (playPromise !== undefined) {
                        playPromise
                            .then(() => {
                                isAudioPlaying = true;
                                playAudioText.textContent = 'Listening...';
                                playAudioBtn.disabled = false;
                            })
                            .catch(error => {
                                // Autoplay blocked or audio not ready - user can click play button
                                console.log("Quiz audio autoplay blocked or not ready:", error);
                                isAudioPlaying = false;
                                playAudioText.textContent = 'Click to Play Question';
                                playAudioBtn.disabled = false;
                                // Preload the audio so it's ready when user clicks
                                storyAudio.load();
                            });
                    } else {
                        // Fallback for older browsers
                        playAudioBtn.disabled = false;
                        playAudioText.textContent = 'Click to Play Question';
                    }
                    
                    // Since a question is loaded, the next button should be disabled until answered
                    nextBtn.disabled = true;

                } else {
                    // Quiz session finished (after the last question was answered and Next was clicked)
                    currentQuizQuestion = null;
                    isQuizAnswered = true;
                    quizArea.classList.add('hidden');
                    storyText.classList.add('text-center');
                    storyText.textContent = "Great work! You’ve answered all the questions. Click 'Next' to continue.";
                    
                    // Ensure the 'Next' button is set up
                    nextBtn.disabled = false;
                }
                
            } else {
                // --- STORY PAGE LOGIC ---
                storyText.classList.add('text-center');
                storyText.textContent = page.text;
                
                // Attempt to play audio
                if (index >= 0) {
                    playCurrentAudio();
                }

                // Reset quiz state when leaving a quiz page
                currentQuizQuestion = null;
                currentQuizId = null;
            }
            
            // 4. Update Controls
            updateControls();
        }

        /**
         * Plays the audio for the current page.
         */
        function playCurrentAudio() {
            storyAudio.pause();
            storyAudio.currentTime = 0;
            
            // Ensure audio is loaded before playing
            if (storyAudio.readyState < 2) {
                storyAudio.load();
                storyAudio.addEventListener('canplay', function tryPlay() {
                    storyAudio.removeEventListener('canplay', tryPlay);
                    attemptPlay();
                }, { once: true });
            } else {
                attemptPlay();
            }
            
            function attemptPlay() {
                const playPromise = storyAudio.play();
                if (playPromise !== undefined) {
                    playPromise
                        .then(() => {
                            playAudioBtn.disabled = false;
                            isAudioPlaying = true;
                            playAudioText.textContent = 'Listening...';
                        })
                        .catch(error => {
                            console.error("Audio playback failed (usually due to autoplay restrictions).", error);
                            playAudioBtn.disabled = false;
                            playAudioText.textContent = 'Click to Play';
                            isAudioPlaying = false;
                        });
                }
            }
        }
        
        /**
         * Handles a quiz answer attempt.
         * @param {string} selectedAnswer The letter A, B, C, or D selected by the user.
         */
        function handleQuizAnswer(selectedAnswer) {
            if (isQuizAnswered || !currentQuizQuestion) return; 

            isQuizAnswered = true;
            
            const correctAnswer = currentQuizQuestion.correctAnswer;
            const selectedButton = document.querySelector(`.quiz-btn[data-answer="${selectedAnswer}"]`);

            quizButtons.forEach(btn => btn.disabled = true);
            
            if (selectedAnswer === correctAnswer) {
                selectedButton.classList.add('correct');
                quizFeedback.textContent = 'Correct! Great job!';
                quizFeedback.classList.remove('text-red-600');
                quizFeedback.classList.add('text-green-600');
            } else {
                selectedButton.classList.add('incorrect');
                document.querySelector(`.quiz-btn[data-answer="${correctAnswer}"]`).classList.add('correct');
                quizFeedback.textContent = `Incorrect. The correct answer was ${correctAnswer}.`;
                quizFeedback.classList.remove('text-green-600');
                quizFeedback.classList.add('text-red-600');
            }

            nextBtn.disabled = false;
            updateControls();
        }


        /**
         * Updates the disabled state of the navigation buttons and their text.
         */
        function updateControls() {
            const lastPageIndex = storyData.length - 1;
            prevBtn.disabled = currentPageIndex <= 0;
            
            const isQuizPage = storyData[currentPageIndex]?.isQuiz || false;
            const isLastPage = currentPageIndex === lastPageIndex;
            const remainingQuestions = currentQuizId ? (quizSessions[currentQuizId]?.length || 0) : 0;

            if (isQuizPage) {
                // Logic for Quiz Page controls
                if (!isQuizAnswered) {
                    nextBtn.disabled = true;
                    nextBtn.innerHTML = 'Next <svg class="w-5 h-5 ml-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 5l7 7-7 7M5 5l7 7-7 7"></path></svg>';
                } else {
                    nextBtn.disabled = false;
                    
                    if (remainingQuestions > 0) {
                        // Questions remain, show 'Next Question'
                        nextBtn.innerHTML = 'Next Question <svg class="w-5 h-5 ml-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 5l7 7-7 7M5 5l7 7-7 7"></path></svg>';
                    } else {
                        nextBtn.innerHTML = isLastPage
                            ? 'Restart <svg class="w-5 h-5 ml-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2.158m15.357 2.158H15"></path></svg>'
                            : 'Continue <svg class="w-5 h-5 ml-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 5l7 7-7 7M5 5l7 7-7 7"></path></svg>';
                    }
                }
            } else {
                // Logic for Story Page controls
                nextBtn.disabled = false; // Always allow moving forward
                if (isLastPage) {
                    nextBtn.innerHTML = 'Restart <svg class="w-5 h-5 ml-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2.158m15.357 2.158H15"></path></svg>';
                } else {
                    nextBtn.innerHTML = 'Next <svg class="w-5 h-5 ml-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 5l7 7-7 7M5 5l7 7-7 7"></path></svg>';
                }
            }
            
            // The play button is only disabled while the audio is actively playing
            playAudioBtn.disabled = isAudioPlaying;
        }
        
        // --- Event Listeners ---

        // Audio Ended Event
        storyAudio.addEventListener('ended', () => {
            isAudioPlaying = false;
            updateControls();
            playAudioText.textContent = 'Listen Again';
        });

        // Audio Error Event
        storyAudio.addEventListener('error', (e) => {
            console.error("Audio error:", e);
            playAudioBtn.disabled = false;
            playAudioText.textContent = 'Audio Error! (Click to Retry)';
            isAudioPlaying = false; 
        });

        // Manual Play Button
        playAudioBtn.addEventListener('click', () => {
            const isQuizPage = storyData[currentPageIndex]?.isQuiz || false;
            if (currentPageIndex !== -1) {
                if (isQuizPage && currentQuizQuestion) {
                    // Play quiz question audio
                    storyAudio.src = currentQuizQuestion.audio;
                    playCurrentAudio();
                } else if (!isQuizPage) {
                    // Play story page audio
                    playCurrentAudio();
                }
            }
        });

        // Next Button
        nextBtn.addEventListener('click', () => {
            const isQuizPage = storyData[currentPageIndex]?.isQuiz || false;
            const lastPageIndex = storyData.length - 1;

            if (isQuizPage) {
                const remainingQuestions = currentQuizId ? (quizSessions[currentQuizId]?.length || 0) : 0;
                if (remainingQuestions > 0) {
                    // Load next question on the same quiz page
                    loadStoryPage(currentPageIndex); 
                } else {
                    // Quiz finished, move to the next story page if it exists, otherwise restart
                    const nextIndex = currentPageIndex + 1;
                    if (nextIndex < storyData.length) {
                        loadStoryPage(nextIndex);
                    } else {
                        loadStoryPage(0);
                    }
                }
            } else {
                const nextIndex = currentPageIndex + 1;
                if (nextIndex < storyData.length) {
                    loadStoryPage(nextIndex);
                } else {
                    // Restart once we've reached the end of all pages
                    loadStoryPage(0);
                }
            }
        });

        // Previous Button
        prevBtn.addEventListener('click', () => {
            if (currentPageIndex > 0) {
                loadStoryPage(currentPageIndex - 1);
            }
        });

        // Quiz Button Listeners
        quizButtons.forEach(button => {
            button.addEventListener('click', (event) => {
                handleQuizAnswer(event.currentTarget.getAttribute('data-answer'));
            });
        });

        // --- Initialization ---
        window.onload = () => {
            loadStoryPage(0);
        };
    </script>

</body>
</html>
