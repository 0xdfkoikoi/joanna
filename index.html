<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Story Sprout Reader</title>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Custom styling to ensure the font looks friendly and the layout is centered -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f0f4f8; /* Light background */
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <!-- Main Story Container -->
    <div id="story-container" class="bg-white shadow-2xl rounded-xl w-full max-w-4xl overflow-hidden flex flex-col transition-all duration-300">
        
        <!-- Header -->
        <header class="p-4 bg-indigo-600 text-white text-center rounded-t-xl">
            <h1 class="text-3xl font-extrabold">🚀 Story Sprouts for English</h1>
            <p class="text-sm opacity-90">Listen, Read, and Learn!</p>
        </header>

        <!-- Story Content Area -->
        <main class="flex-grow p-6 md:p-8 space-y-6">
            
            <!-- Image Display -->
            <!-- Added 'flex items-center justify-center' for perfect vertical/horizontal centering -->
            <div class="relative bg-gray-200 rounded-lg overflow-hidden border-4 border-indigo-200 aspect-video flex items-center justify-center">
                <!-- Image element with error fallback -->
                <!-- Changed 'object-cover' to 'object-contain' to show the full image -->
                <img id="story-image" src="" alt="Story illustration" class="w-full h-full object-contain transition-opacity duration-500"
                     onerror="this.onerror=null; this.src='https://placehold.co/800x450/ef4444/ffffff?text=Image+Load+Error'; document.getElementById('loading-indicator').classList.add('hidden');">
                <div id="loading-indicator" class="absolute inset-0 flex items-center justify-center bg-gray-800 bg-opacity-70 text-white text-lg font-bold hidden">Loading...</div>
            </div>

            <!-- Subtitle/Text Area -->
            <div class="bg-white p-4 rounded-lg shadow-inner border border-gray-200 min-h-[5rem] flex items-center justify-center">
                <p id="story-text" class="text-xl md:text-2xl text-gray-800 font-semibold text-center leading-relaxed">Click "Next" to begin the story!</p>
            </div>

        </main>

        <!-- Controls and Navigation -->
        <footer class="p-4 bg-white border-t border-gray-100 flex flex-col sm:flex-row justify-between items-center space-y-4 sm:space-y-0">
            
            <!-- Audio Playback Button (Fallback if audio doesn't auto-play) -->
            <button id="play-audio-btn" class="w-full sm:w-auto px-6 py-3 bg-green-500 hover:bg-green-600 text-white font-bold rounded-full shadow-lg transition duration-200 disabled:opacity-50 flex items-center justify-center">
                <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12"></path>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v10a2 2 0 002 2h2"></path>
                </svg>
                <span id="play-audio-text">Listen Again</span>
            </button>

            <!-- Hidden Audio Element -->
            <audio id="story-audio" class="hidden"></audio>

            <!-- Navigation Buttons -->
            <div class="flex space-x-4">
                <!-- Previous Button -->
                <button id="prev-btn" class="px-6 py-3 bg-gray-300 hover:bg-gray-400 text-gray-800 font-bold rounded-full shadow transition duration-200 disabled:opacity-50 flex items-center" disabled>
                    <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 19l-7-7 7-7m8 14l-7-7 7-7"></path></svg>
                    Previous
                </button>
                
                <!-- Next Button -->
                <button id="next-btn" class="px-6 py-3 bg-indigo-500 hover:bg-indigo-600 text-white font-bold rounded-full shadow-lg transition duration-200 flex items-center">
                    Next
                    <svg class="w-5 h-5 ml-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 5l7 7-7 7M5 5l7 7-7 7"></path></svg>
                </button>
            </div>
        </footer>

    </div>

    <script>
        const GITHUB_BASE = 'https://raw.githubusercontent.com/0xdfkoikoi/joanna/refs/heads/main/story/';
        
        // --- Story Data ---
        // Structure: image URL, audio URL, and corresponding text (subtitle)
        const storyData = [
            {
                image: GITHUB_BASE + '1.jpg',
                audio: GITHUB_BASE + '1.mp3',
                text: "Once upon a time, there was a friendly little squirrel named Squeaky, ready for an adventure."
            },
            {
                // Page 2: Now using the user's provided 2.jpg and 2.mp3
                image: GITHUB_BASE + '2.jpg',
                audio: GITHUB_BASE + '2.mp3', 
                text: "Squeaky jumped up and down on a mossy log, hoping to find a big, shiny nut."
            },
            {
                // Page 3: Placeholder content for future files (3.jpg, 3.mp3, etc.)
                image: 'https://placehold.co/800x450/10b981/ffffff?text=Page+3:+The+Big+Find',
                audio: GITHUB_BASE + '1.mp3', // Reusing the first audio for demo purposes
                text: "Success! He found the biggest nut in the whole forest. It was a perfect reward for his efforts."
            }
        ];

        // --- State Variables ---
        let currentPageIndex = -1; // Start at -1 to show a welcome screen first
        let isAudioPlaying = false;

        // --- DOM Elements ---
        const storyImage = document.getElementById('story-image');
        const storyAudio = document.getElementById('story-audio');
        const storyText = document.getElementById('story-text');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const playAudioBtn = document.getElementById('play-audio-btn');
        const loadingIndicator = document.getElementById('loading-indicator');
        const playAudioText = document.getElementById('play-audio-text');

        /**
         * Loads and displays the specified story page.
         * @param {number} index The index of the story page to load.
         */
        function loadStoryPage(index) {
            if (index < 0 || index >= storyData.length) {
                console.error("Invalid page index:", index);
                return;
            }

            currentPageIndex = index;
            const page = storyData[index];

            // 1. Update UI state (Loading)
            storyImage.style.opacity = '0';
            loadingIndicator.classList.remove('hidden');
            playAudioBtn.disabled = true;

            // 2. Update Content
            storyImage.onload = () => {
                // Image loaded successfully, fade it in and hide loading indicator
                storyImage.style.opacity = '1';
                loadingIndicator.classList.add('hidden');
            };
            
            // Set content sources
            storyImage.src = page.image;
            storyAudio.src = page.audio;
            storyText.textContent = page.text;
            
            // 3. IMMEDIATELY ATTEMPT TO PLAY AUDIO. 
            // This is the key change: calling playCurrentAudio directly 
            // from the user's synchronous click event, which is less likely to be blocked.
            playCurrentAudio();

            // 4. Update Controls
            updateControls();
        }

        /**
         * Plays the audio for the current page.
         */
        function playCurrentAudio() {
            // Stop any currently playing audio
            storyAudio.pause();
            storyAudio.currentTime = 0;
            
            // Attempt to play
            storyAudio.play()
                .then(() => {
                    // Success path
                    playAudioBtn.disabled = false;
                    isAudioPlaying = true;
                    playAudioText.textContent = 'Listening...';
                })
                .catch(error => {
                    // Failure path (likely due to browser autoplay policy)
                    console.error("Audio playback failed (usually due to autoplay restrictions). User needs to click play.", error);
                    playAudioBtn.disabled = false; // Enable manual play button
                    playAudioText.textContent = 'Listen Again';
                });
        }

        /**
         * Updates the disabled state of the navigation buttons.
         */
        function updateControls() {
            prevBtn.disabled = currentPageIndex <= 0;
            nextBtn.disabled = currentPageIndex >= storyData.length - 1;
            
            // The play button is only disabled while the audio is actively playing
            if (currentPageIndex >= 0) {
                 playAudioBtn.disabled = isAudioPlaying;
            } else {
                 playAudioBtn.disabled = true;
            }
        }
        
        // --- Event Listeners ---

        // Audio Ended Event
        storyAudio.addEventListener('ended', () => {
            isAudioPlaying = false;
            playAudioBtn.disabled = false;
            playAudioText.textContent = 'Listen Again';
        });

        // Audio Error Event
        storyAudio.addEventListener('error', (e) => {
            console.error("Audio error:", e);
            playAudioBtn.disabled = false;
            playAudioText.textContent = 'Audio Error! (Click to Retry)';
            // Prevent attempting to play again until user clicks
            isAudioPlaying = false; 
        });

        // Manual Play Button
        playAudioBtn.addEventListener('click', () => {
            if (currentPageIndex !== -1) {
                playCurrentAudio();
            }
        });

        // Next Button
        nextBtn.addEventListener('click', () => {
            if (currentPageIndex < storyData.length - 1) {
                loadStoryPage(currentPageIndex + 1);
            }
        });

        // Previous Button
        prevBtn.addEventListener('click', () => {
            if (currentPageIndex > 0) {
                loadStoryPage(currentPageIndex - 1);
            }
        });

        // --- Initialization ---
        window.onload = () => {
            // Load the first page immediately on load.
            loadStoryPage(0);
        };
    </script>

</body>
</html>
